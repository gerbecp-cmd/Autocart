name: Android build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**','web/**','.github/workflows/android-build.yml']
  pull_request:
    paths: ['android/**','web/**','.github/workflows/android-build.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '9.4.1'}
      - name: Core tests
        run: node web/test-core.cjs
      - name: Build APK
        env:
          AUTOCART_API_URL: ${{ secrets.AUTOCART_API_URL }}
          AUTOCART_APPLICATION_ID: ${{ secrets.AUTOCART_APPLICATION_ID }}
        run: |
          ARGS=()
          [ -n "$AUTOCART_API_URL" ] && ARGS+=("-PAUTOCART_API_URL=$AUTOCART_API_URL")
          [ -n "$AUTOCART_APPLICATION_ID" ] && ARGS+=("-PAUTOCART_APPLICATION_ID=$AUTOCART_APPLICATION_ID")
          gradle -p android :app:assembleDebug "${ARGS[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: AutoCart-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
